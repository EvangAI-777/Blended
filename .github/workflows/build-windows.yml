name: Build Blended (Windows x64)

# Two build modes:
#
#   tag push (v*)       → full release build → artifact + GitHub Release (separate job)
#   workflow_dispatch   → choose build type, produces artifact only
#
# Every build records SHA-256 checksums in the run summary and a signed build-provenance
# attestation for Blended.exe and the zip. Third-party actions are pinned to commit SHAs
# (kept current by Dependabot, .github/dependabot.yml).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'CMake build type'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - RelWithDebInfo

# Read-only token by default; each job asks for what it needs.
permissions:
  contents: read

# One build per ref at a time. A second dispatch queues instead of cancelling a running
# 2-hour build.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write       # build provenance (Sigstore)
      attestations: write  # build provenance
    outputs:
      version: ${{ steps.package.outputs.version }}

    env:
      BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
      # Short paths to dodge Windows MAX_PATH limit
      SRC_DIR: D:\s
      BUILD_DIR: D:\b
      LIB_DIR: lib/windows_x64

    steps:
    # ── Checkout ──────────────────────────────────────────────
    - name: Checkout source
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        path: src
        fetch-depth: 1
        lfs: false
        submodules: false
        persist-credentials: false

    - name: Compute submodule hash
      id: submod-hash
      shell: bash
      run: echo "hash=$(sha256sum src/.gitmodules | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Move source to short path
      shell: cmd
      run: move src %SRC_DIR%

    # ── LFS ───────────────────────────────────────────────────
    - name: Setup Git LFS
      shell: cmd
      run: |
        git lfs install
        git lfs version

    - name: Pull source LFS files
      shell: bash
      working-directory: ${{ env.SRC_DIR }}
      run: |
        set -e
        # Checkout used lfs:false for speed; pull now.
        # LFS objects live upstream on projects.blender.org.
        # GitHub fork doesn't host LFS objects; fetch from projects.blender.org directly.
        git remote add lfs-fallback "https://projects.blender.org/blender/blender.git"
        git config "remote.lfs-fallback.pushurl" "no_push"
        git lfs fetch lfs-fallback
        git lfs checkout

    # ── Precompiled libraries ─────────────────────────────────
    - name: Restore library cache
      id: cache-libs
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ env.SRC_DIR }}/lib/windows_x64
        key: blender-libs-win-x64-${{ steps.submod-hash.outputs.hash }}
        restore-keys: blender-libs-win-x64-
      continue-on-error: true

    - name: Fetch precompiled libraries
      if: steps.cache-libs.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ env.SRC_DIR }}
      run: |
        set -e
        # .gitmodules sets update=none so make_update.py can manage manually.
        # Override for CI so submodule update actually clones.
        git config submodule."$LIB_DIR".update checkout
        GIT_LFS_SKIP_SMUDGE=1 git submodule update --init --progress $LIB_DIR
        cd "$LIB_DIR"
        # origin is already projects.blender.org/blender/lib-windows_x64.git — pull directly.
        git lfs pull origin

    # ── Toolchain ─────────────────────────────────────────────
    - name: Setup MSVC 2022
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: x64

    - name: Install Ninja
      uses: seanmiddleditch/gha-setup-ninja@96bed6edff20d1dd61ecff9b75cc519d516e6401 # v5

    # ── Clean ──────────────────────────────────────────────────
    - name: Clean build directory
      shell: pwsh
      run: |
        if (Test-Path $env:BUILD_DIR) {
          Remove-Item -Recurse -Force $env:BUILD_DIR
          Write-Host "Cleaned build directory"
        }

    # ── Configure ─────────────────────────────────────────────
    - name: CMake configure
      shell: cmd
      run: >
        cmake
        -S %SRC_DIR%
        -B %BUILD_DIR%
        -G Ninja
        -DCMAKE_BUILD_TYPE=%BUILD_TYPE%
        -C "%SRC_DIR%/build_files/cmake/config/blended_release.cmake"

    # ── Build ─────────────────────────────────────────────────
    - name: Build
      shell: cmd
      run: cmake --build %BUILD_DIR% --target install --parallel %NUMBER_OF_PROCESSORS%

    # ── Package ───────────────────────────────────────────────
    - name: Read version and package
      id: package
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        # Blended uses its own BLENDED_VERSION_* defines, independent of the
        # upstream BLENDER_VERSION integer. Versioning starts at 0.x.
        $header = Get-Content "$env:SRC_DIR/source/blender/blenkernel/BKE_blender_version.h" -Raw

        $majorMatch = [regex]::Match($header, '#define BLENDED_VERSION_MAJOR\s+(\d+)')
        $minorMatch = [regex]::Match($header, '#define BLENDED_VERSION_MINOR\s+(\d+)')
        $patchMatch = [regex]::Match($header, '#define BLENDED_VERSION_PATCH\s+(\d+)')

        if (-not $majorMatch.Success) {
          Write-Error "Could not parse BLENDED_VERSION_MAJOR from version header"
          exit 1
        }

        $major = $majorMatch.Groups[1].Value
        $minor = if ($minorMatch.Success) { $minorMatch.Groups[1].Value } else { "0" }
        $patch = if ($patchMatch.Success) { $patchMatch.Groups[1].Value } else { "0" }

        $version = "$major.$minor.$patch"
        $name    = "Blended-$version-windows-x64"
        $zip     = "$name.zip"

        Write-Host "Version: $version"

        $installDir = "$env:BUILD_DIR\bin"
        if (-not (Test-Path $installDir)) {
          Write-Error "Install directory not found: $installDir"
          exit 1
        }

        Rename-Item $installDir $name
        Compress-Archive -Path "$env:BUILD_DIR\$name" -DestinationPath "$env:BUILD_DIR\$zip"

        # SHA-256 checksums, in the format `sha256sum --check` reads.
        $zipHash = (Get-FileHash "$env:BUILD_DIR\$zip" -Algorithm SHA256).Hash.ToLower()
        [IO.File]::WriteAllText("$env:BUILD_DIR\$zip.sha256", "$zipHash  $zip`n")
        $exeHash = (Get-FileHash "$env:BUILD_DIR\$name\Blended.exe" -Algorithm SHA256).Hash.ToLower()
        "### Blended $version" | Out-File -Append $env:GITHUB_STEP_SUMMARY
        "- ``$zip`` SHA-256: ``$zipHash``" | Out-File -Append $env:GITHUB_STEP_SUMMARY
        "- ``Blended.exe`` SHA-256: ``$exeHash``" | Out-File -Append $env:GITHUB_STEP_SUMMARY

        "version=$version"                        | Out-File -Append $env:GITHUB_OUTPUT

        "PACKAGE_NAME=$zip"                       | Out-File -Append $env:GITHUB_ENV
        "PACKAGE_PATH=$env:BUILD_DIR\$zip"         | Out-File -Append $env:GITHUB_ENV
        "PACKAGE_DIR=$env:BUILD_DIR\$name"         | Out-File -Append $env:GITHUB_ENV
        "VERSION=$version"                        | Out-File -Append $env:GITHUB_ENV
        "SHA256_PATH=$env:BUILD_DIR\$zip.sha256"  | Out-File -Append $env:GITHUB_ENV
        # Forward slashes: the attestation action reads subject paths as glob patterns.
        $fwd = $env:BUILD_DIR -replace '\\', '/'
        "ATTEST_EXE=$fwd/$name/Blended.exe"      | Out-File -Append $env:GITHUB_ENV
        "ATTEST_ZIP=$fwd/$zip"                   | Out-File -Append $env:GITHUB_ENV

        Write-Host "Packaged: $zip"

    # ── Upload artifact ───────────────────────────────────────
    - name: Upload artifact
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: Blended-${{ env.VERSION }}-windows-x64
        path: ${{ env.PACKAGE_DIR }}
        retention-days: 90
        compression-level: 0

    # ── Build provenance ──────────────────────────────────────
    # Signed record tying the binary and the release zip to this commit and workflow run.
    # Verify with: gh attestation verify Blended.exe --repo EvangAI-777/Blended
    # Runs after the upload so a provenance failure never costs the test build its artifact.
    # It may fail a dispatch build without stopping it, but it must pass for a release.
    - name: Attest build provenance
      continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
      with:
        subject-path: |
          ${{ env.ATTEST_EXE }}
          ${{ env.ATTEST_ZIP }}

    # ── Smoke test ────────────────────────────────────────────
    # Runs the packaged build headless: startup, Python startup scripts, window-manager RNA,
    # File > Open of a legacy .blend, Save As .blended and reopen. Runs after the upload so a
    # failing build is still downloadable for debugging; a failure blocks the GitHub Release.
    - name: Smoke test (headless)
      shell: pwsh
      timeout-minutes: 15
      run: |
        $exe   = Join-Path $env:PACKAGE_DIR 'Blended.exe'
        $out   = Join-Path $env:RUNNER_TEMP 'blended-smoke'
        $blend = Join-Path $env:SRC_DIR 'release\datafiles\startup.blend'
        New-Item -ItemType Directory -Force $out | Out-Null
        Get-ChildItem $env:TEMP -Filter '*crash.txt' -ErrorAction SilentlyContinue | Remove-Item -Force

        $argList = @(
          '--background', '--factory-startup', '--python-exit-code', '1',
          '--python', "`"$env:SRC_DIR\tests\python\blended_smoke_test.py`"",
          '--', "`"$blend`"", "`"$out`""
        )
        $proc = Start-Process -FilePath $exe -ArgumentList $argList -Wait -PassThru -NoNewWindow `
          -RedirectStandardOutput "$out\stdout.txt" -RedirectStandardError "$out\stderr.txt"
        Get-Content "$out\stdout.txt", "$out\stderr.txt" -ErrorAction SilentlyContinue

        if ($proc.ExitCode -ne 0) {
          Write-Host "::error::Smoke test failed (exit code $($proc.ExitCode))"
          Get-ChildItem $env:TEMP -Filter '*crash.txt' -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "=== $($_.FullName) ==="
            Get-Content $_.FullName
          }
          exit 1
        }

    # ── Release files (tags only) ─────────────────────────────
    # The release itself is published by the `release` job, which is the only job with write
    # access to the repository. It runs only after this job, smoke test included, passed.
    - name: Upload release files
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: release-files
        path: |
          ${{ env.PACKAGE_PATH }}
          ${{ env.SHA256_PATH }}
        retention-days: 7
        compression-level: 0

  # ── GitHub Release (tags only) ────────────────────────────
  release:
    name: GitHub Release
    needs: build-windows-x64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download release files
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: release-files
        path: dist

    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        name: Blended ${{ needs.build-windows-x64.outputs.version }}
        files: dist/*
        generate_release_notes: true
        draft: false
